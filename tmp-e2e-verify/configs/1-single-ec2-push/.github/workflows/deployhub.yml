name: DeployHub
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (leave blank on push; use "all" for every enabled env)'
        required: false
        type: choice
        options:
          - production
          - all
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: npm install
      - name: Install DeployHub CLI
        run: npm install @akash-chowdhury-24/deployhub@latest --no-save
      - name: Build (and auto-deploy push-triggered envs)
        run: node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js build
        env:
          DEPLOYHUB_ENV: production
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      - name: Deploy (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYHUB_ENV: production
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ENV_INPUT="${{ inputs.environment }}"
          if [ -z "$ENV_INPUT" ] || [ "$ENV_INPUT" = "all" ]; then
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js deploy --env all
          else
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js deploy --env "$ENV_INPUT"
          fi
