name: DeployHub Rollback
on:
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Exact buildId to restore (leave blank = previous build)'
        required: false
        type: string
      environment:
        description: 'Environment to roll back (or "all")'
        required: false
        type: choice
        options:
          - development
          - staging
          - production
          - all
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.4'

      - name: Configure kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.PRODUCTION_KUBECONFIG }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.kube"
          if echo "$KUBECONFIG_SECRET" | base64 -d > "$GITHUB_WORKSPACE/.kube/config" 2>/dev/null; then
            :
          else
            printf '%s' "$KUBECONFIG_SECRET" > "$GITHUB_WORKSPACE/.kube/config"
          fi
          chmod 600 "$GITHUB_WORKSPACE/.kube/config"
      - name: Install DeployHub CLI
        run: npm install @akash-chowdhury-24/deployhub@latest --no-save
      - name: Rollback
        env:
          DEPLOYHUB_ENV: development
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STAGING_DOCKER_IMAGE_NAME: ${{ secrets.STAGING_DOCKER_IMAGE_NAME }}
          STAGING_DOCKER_IMAGE_TAG: ${{ secrets.STAGING_DOCKER_IMAGE_TAG }}
          STAGING_DOCKER_REGISTRY_URL: ${{ secrets.STAGING_DOCKER_REGISTRY_URL }}
          STAGING_DOCKER_REGISTRY_USERNAME: ${{ secrets.STAGING_DOCKER_REGISTRY_USERNAME }}
          STAGING_DOCKER_REGISTRY_TOKEN: ${{ secrets.STAGING_DOCKER_REGISTRY_TOKEN }}
          STAGING_DOCKER_HOST: ${{ secrets.STAGING_DOCKER_HOST }}
          STAGING_DOCKER_TLS_VERIFY: ${{ secrets.STAGING_DOCKER_TLS_VERIFY }}
          STAGING_DOCKER_CERT_PATH: ${{ secrets.STAGING_DOCKER_CERT_PATH }}
          PRODUCTION_KUBECONFIG: ${{ secrets.PRODUCTION_KUBECONFIG }}
          PRODUCTION_KUBE_CONTEXT: ${{ secrets.PRODUCTION_KUBE_CONTEXT }}
          PRODUCTION_KUBE_NAMESPACE: ${{ secrets.PRODUCTION_KUBE_NAMESPACE }}
          PRODUCTION_DOCKER_IMAGE_NAME: ${{ secrets.PRODUCTION_DOCKER_IMAGE_NAME }}
          PRODUCTION_DOCKER_IMAGE_TAG: ${{ secrets.PRODUCTION_DOCKER_IMAGE_TAG }}
          PRODUCTION_DOCKER_REGISTRY_URL: ${{ secrets.PRODUCTION_DOCKER_REGISTRY_URL }}
          PRODUCTION_DOCKER_REGISTRY_USERNAME: ${{ secrets.PRODUCTION_DOCKER_REGISTRY_USERNAME }}
          PRODUCTION_DOCKER_REGISTRY_TOKEN: ${{ secrets.PRODUCTION_DOCKER_REGISTRY_TOKEN }}
          PRODUCTION_KUBE_IMAGE_PULL_SECRET: ${{ secrets.PRODUCTION_KUBE_IMAGE_PULL_SECRET }}
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          ENV_INPUT="${{ inputs.environment }}"
          BUILD_INPUT="${{ inputs.buildId }}"
          ENV_FLAG=""
          if [ -z "$ENV_INPUT" ] || [ "$ENV_INPUT" = "all" ]; then
            ENV_FLAG="--env all"
          else
            ENV_FLAG="--env $ENV_INPUT"
          fi
          if [ -n "$BUILD_INPUT" ]; then
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js rollback "$BUILD_INPUT" $ENV_FLAG
          else
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js rollback $ENV_FLAG
          fi
