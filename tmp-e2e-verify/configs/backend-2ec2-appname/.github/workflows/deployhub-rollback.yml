name: DeployHub Rollback
on:
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Exact buildId to restore (leave blank = previous build)'
        required: false
        type: string
      environment:
        description: 'Environment to roll back (or "all")'
        required: false
        type: choice
        options:
          - development
          - production
          - all
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DeployHub CLI
        run: npm install @akash-chowdhury-24/deployhub@latest --no-save
      - name: Rollback
        env:
          DEPLOYHUB_ENV: development
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_SSH_PORT: ${{ secrets.SSH_SSH_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          SSH_APP_NAME: ${{ secrets.SSH_APP_NAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_SSH_PORT: ${{ secrets.PRODUCTION_SSH_SSH_PORT }}
          PRODUCTION_SSH_DEPLOY_PATH: ${{ secrets.PRODUCTION_SSH_DEPLOY_PATH }}
          PRODUCTION_SSH_APP_NAME: ${{ secrets.PRODUCTION_SSH_APP_NAME }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_EC2_INSTANCE_ID: ${{ secrets.PRODUCTION_EC2_INSTANCE_ID }}
          PRODUCTION_AWS_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
          PRODUCTION_AWS_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
          PRODUCTION_AWS_REGION: ${{ secrets.PRODUCTION_AWS_REGION }}
        run: |
          ENV_INPUT="${{ inputs.environment }}"
          BUILD_INPUT="${{ inputs.buildId }}"
          ENV_FLAG=""
          if [ -z "$ENV_INPUT" ] || [ "$ENV_INPUT" = "all" ]; then
            ENV_FLAG="--env all"
          else
            ENV_FLAG="--env $ENV_INPUT"
          fi
          if [ -n "$BUILD_INPUT" ]; then
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js rollback "$BUILD_INPUT" $ENV_FLAG
          else
            node ./node_modules/@akash-chowdhury-24/deployhub/src/cli/index.js rollback $ENV_FLAG
          fi
